name: Ani Doctor - Host-ready ZIP

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ani-doctor-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify documentation and package Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-root
          MYSQL_DATABASE: ani_doctor_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -ptest-only-root" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate documents and detect Laravel app
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          for file in AI_RULES.md ARCHITECTURE.md UI_GUIDELINES.md COMPONENTS.md SECURITY.md PRD.md DEPLOYMENT.md; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty documentation: $file"
              exit 1
            fi
          done

          if [[ -e composer.json || -e composer.lock || -e artisan || -e public/index.php ]]; then
            for file in composer.json composer.lock artisan public/index.php; do
              if [[ ! -f "$file" ]]; then
                echo "::error::Incomplete Laravel app: $file missing. No unsafe or incomplete ZIP will be produced."
                exit 1
              fi
            done
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Documentation-only status
        if: steps.detect.outputs.app == 'false'
        shell: bash
        run: |
          echo "### Ani Doctor - documentation phase (P0)" >> "$GITHUB_STEP_SUMMARY"
          echo "No Laravel source is present yet. Documentation validation passed; installable ZIP intentionally skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up PHP 8.4 and Composer
        if: steps.detect.outputs.app == 'true'
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, dom, fileinfo, pdo_mysql, pdo_sqlite, xml, bcmath, intl, zip, gd
          tools: composer:v2
          coverage: none

      - name: Validate Composer lockfile
        if: steps.detect.outputs.app == 'true'
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --dry-run --no-interaction --no-progress

      - name: Install dependencies for tests
        if: steps.detect.outputs.app == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Create ephemeral test key
        if: steps.detect.outputs.app == 'true'
        shell: bash
        run: |
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
          # Dotenv expects the file to exist; all test values still come from CI.
          touch .env

      - name: Check PHP formatting and syntax
        if: steps.detect.outputs.app == 'true'
        run: |
          vendor/bin/pint --test
          find app bootstrap config database routes tests lang scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run automated PHP tests
        if: steps.detect.outputs.app == 'true'
        shell: bash
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          if [[ ! -f phpunit.xml && ! -f phpunit.xml.dist ]]; then
            echo "::error::Laravel application must ship phpunit.xml (or phpunit.xml.dist) and automated tests."
            exit 1
          fi
          php artisan test --without-tty

      - name: MySQL features, booking/payment/attendance/forms/SMS/discount concurrency, migration rollback
        if: steps.detect.outputs.app == 'true'
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ani_doctor_test
          DB_USERNAME: root
          DB_PASSWORD: test-only-root
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          vendor/bin/phpunit
          vendor/bin/phpunit -c phpunit.mysql.xml
          php artisan migrate --seed --force
          php artisan migrate:rollback --force
          php artisan migrate --seed --force

      - name: Install isolated browser verification tools
        if: steps.detect.outputs.app == 'true'
        run: |
          npm ci --prefix tests/Browser --ignore-scripts --no-audit --no-fund
          tests/Browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify RTL panels and progressive form controls in Chromium
        if: steps.detect.outputs.app == 'true'
        shell: bash
        env:
          APP_ENV: local
          APP_DEBUG: 'false'
          APP_URL: http://127.0.0.1:18558
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/browser-panel-ui.sqlite
          SESSION_DRIVER: file
          SESSION_SECURE_COOKIE: 'false'
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          ZARINPAL_ENABLED: 'false'
          EVENT_SMS_ENABLED: 'false'
          SMS_IR_API_KEY: ''
          LOCAL_OTP_PREVIEW: 'false'
          LOCAL_PAYMENT_SIMULATOR: 'false'
          PANEL_SYNTHETIC_FIXTURE: '1'
        run: |
          set -euo pipefail
          touch "$DB_DATABASE"
          php tests/Support/panel-browser-seed.php
          php -S 127.0.0.1:18558 -t public tests/Support/panel-browser-router.php > "$RUNNER_TEMP/panel-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18558/__ui-fixture > /dev/null; then break; fi
            sleep 1
          done
          cd tests/Browser
          npm test
            php ../Support/weekly-announcement-browser-seed.php
            node weekly-schedule.mjs
            php ../Support/information-browser-seed.php
            node information-pages.mjs
            php ../Support/article-browser-seed.php
            node articles.mjs
            php ../Support/footer-browser-seed.php
            node footer.mjs
            php ../Support/home-about-browser-seed.php
            node home-about.mjs
            php ../Support/home-services-browser-seed.php
            node home-services.mjs
            php ../Support/home-contact-browser-seed.php
            node home-contact.mjs
            php ../Support/emr-browser-seed.php
            node medical-records.mjs

      - name: Upload browser verification evidence
        if: always() && steps.detect.outputs.app == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ani-doctor-panel-browser-${{ github.run_number }}
          path: tests/Browser/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify frontend assets are prebuilt
        if: steps.detect.outputs.app == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d resources/views ]] && grep -R -q --include='*.blade.php' '@vite' resources/views; then
            echo "::error::Blade references @vite; buildless deploy requires prebuilt CSS/JS in public/assets and asset() references."
            exit 1
          fi

      - name: Check production dependencies
        if: steps.detect.outputs.app == 'true'
        run: composer audit --locked --no-dev --no-interaction

      - name: Install production-only dependencies
        if: steps.detect.outputs.app == 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Create secure host-ready ZIP
        if: steps.detect.outputs.app == 'true'
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ani-doctor-host-ready"
          mkdir -p "$stage"
          for item in app bootstrap config database lang public resources routes scripts deployment artisan composer.json composer.lock .env.example vendor DEPLOYMENT.md; do
            if [[ -e "$item" ]]; then
              cp -a "$item" "$stage/"
            fi
          done

          # Ship only the reviewed installation guides, not arbitrary project/reference files.
          mkdir -p "$stage/docs"
          cp docs/INSTALL-LOCAL.md docs/INSTALL-SHARED-HOSTING.md docs/P8.md docs/P8-VALIDATION.md docs/WEBSITE-CMS-PLAN.md docs/WEBSITE-CMS-VALIDATION.md docs/INSTALLATION-AUDIT.md docs/UI-CMS-REDESIGN-AUDIT.md docs/UI-CMS-VALIDATION.md docs/GUIDED-BOOKING-UX.md docs/ADMIN-WORKSPACE-UX.md "$stage/docs/"

          # Runtime state from CI must never be included in an installation package.
          rm -rf "$stage/bootstrap/cache"
          mkdir -p "$stage/bootstrap/cache"
          mkdir -p "$stage/storage/app/private" "$stage/storage/framework/cache/data"
          mkdir -p "$stage/storage/framework/sessions" "$stage/storage/framework/views"
          mkdir -p "$stage/storage/logs"

          # Refuse to publish accidentally committed environment files or keys.
          if find "$stage" -path "$stage/vendor" -prune -o -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.sql' -o -name '*.sqlite' \) ! -name '.env.example' -print | grep -q .; then
            echo "::error::Potential secret or private database file found inside release. Aborting."
            exit 1
          fi

          cat > "$stage/INSTALL.txt" <<'EOF'
          ANI DOCTOR - secure Laravel deployment
          P8 candidate: production guards, encrypted backup/isolated restore, private error logging and acceptance tools, on P1-P7. Check docs and evidence before release. No remote host or live provider certification.
          1. Extract outside public_html; point domain DocumentRoot to public/.
          2. Create production .env on server from .env.example; never reuse CI keys.
          3. Configure production APP_KEY, database, gateways and SMS credentials on server.
          4. Make storage/ and bootstrap/cache/ writable; use HTTPS.
          5. Review migrations, run php artisan migrate --force and optimize on server.
          6. Configure Laravel scheduler and queue worker or compatible cron.
          UPGRADES: preserve the existing .env, APP_KEY and private storage; back up first and review/apply pending migrations. Never run key:generate, migrate:fresh or db:wipe on an existing installation.
          LOCAL: read docs/INSTALL-LOCAL.md and run php scripts/check-install.php before starting the server. Run serve and schedule:work in separate terminals with PHP 8.4.
          Full instructions: DEPLOYMENT.md.
          EOF

          php scripts/verify-package.php --root="$stage" --write-manifest --revision="$GITHUB_SHA"

          short_sha="${GITHUB_SHA:0:7}"
          package="ani-doctor-${short_sha}.zip"
          (cd "$stage" && zip -q -r "$GITHUB_WORKSPACE/$package" .)
          echo "file=$package" >> "$GITHUB_OUTPUT"
          echo "### Installable Laravel ZIP created: $package" >> "$GITHUB_STEP_SUMMARY"
          echo "DocumentRoot must point to Laravel public/. .env and database are deliberately excluded." >> "$GITHUB_STEP_SUMMARY"

      - name: Install candidate ZIP in isolated Apache HTTPS staging and run acceptance load
        if: steps.detect.outputs.app == 'true'
        env:
          MYSQL_PWD: test-only-root
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/p8-installed"
          mkdir -p "$stage"
          unzip -q "${{ steps.bundle.outputs.file }}" -d "$stage"
          php scripts/verify-package.php --root="$stage"
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE ani_doctor_p8_smoke CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker build --pull -f "$stage/deployment/Dockerfile.staging" -t ani-doctor-p8-smoke "$stage"
          docker run -d --name ani-doctor-p8-smoke --network host \
            -e APP_ENV=production -e APP_DEBUG=false -e APP_KEY -e APP_URL=https://localhost:18443 \
            -e DB_CONNECTION=mysql -e DB_HOST=127.0.0.1 -e DB_DATABASE=ani_doctor_p8_smoke -e DB_USERNAME=root -e DB_PASSWORD=test-only-root \
            -e SESSION_DRIVER=database -e CACHE_STORE=database -e SESSION_SECURE_COOKIE=true -e SESSION_ENCRYPT=true \
            -e ZARINPAL_ENABLED=false -e EVENT_SMS_ENABLED=false -e OPS_HSTS_ENABLED=true \
            -e OPS_BACKUP_KEY_FILE=/var/www/app/storage/backup.key -e P8_SYNTHETIC_FIXTURE=1 ani-doctor-p8-smoke
          trap 'docker rm -f ani-doctor-p8-smoke >/dev/null' EXIT
          docker cp tests/Support/p8-staging-fixture.php ani-doctor-p8-smoke:/tmp/p8-fixture.php
          docker cp ani-doctor-p8-smoke:/etc/ssl/certs/p8.crt "$RUNNER_TEMP/p8-ca.crt"
          docker exec --user www-data ani-doctor-p8-smoke php artisan migrate --seed --force
          docker exec --user www-data ani-doctor-p8-smoke php artisan ops:backup-key /var/www/app/storage/backup.key
          docker exec --user www-data ani-doctor-p8-smoke php /tmp/p8-fixture.php > "$RUNNER_TEMP/p8-fixture.json"
          docker exec --user www-data ani-doctor-p8-smoke php artisan optimize
          docker exec --user www-data ani-doctor-p8-smoke php artisan schedule:run
          docker exec --user www-data ani-doctor-p8-smoke php artisan ops:check
          php scripts/staging-smoke.php --origin=https://localhost:18443 --ca="$RUNNER_TEMP/p8-ca.crt"
          service_id=$(php -r '$j=json_decode(file_get_contents($argv[1]),true); echo $j["service"];' "$RUNNER_TEMP/p8-fixture.json")
          day=$(php -r '$j=json_decode(file_get_contents($argv[1]),true); echo $j["date"];' "$RUNNER_TEMP/p8-fixture.json")
          month=$(php -r '$j=json_decode(file_get_contents($argv[1]),true); echo $j["month"];' "$RUNNER_TEMP/p8-fixture.json")
          php scripts/load-test.php --origin=https://localhost:18443 --ca="$RUNNER_TEMP/p8-ca.crt" --service="$service_id" --date="$day" --month="$month"
          # Reproduce a files-only P8 -> CMS upgrade on this disposable DB, then migrate safely.
          docker cp tests/Support/website-upgrade-fixture.php ani-doctor-p8-smoke:/tmp/website-upgrade-fixture.php
          docker exec --user www-data ani-doctor-p8-smoke php /tmp/website-upgrade-fixture.php
          php scripts/staging-smoke.php --origin=https://localhost:18443 --ca="$RUNNER_TEMP/p8-ca.crt"

          # An independent DAST engine attacks only this disposable installation.
          docker cp tests/Support/website-security-fixture.php ani-doctor-p8-smoke:/tmp/website-security-fixture.php
          docker exec --user www-data ani-doctor-p8-smoke php /tmp/website-security-fixture.php
          mkdir -p "$RUNNER_TEMP/security-results"
          chmod 777 "$RUNNER_TEMP/security-results"
          docker cp tests/Support/website-http-probes.php ani-doctor-p8-smoke:/tmp/website-http-probes.php
          set +e
          docker exec --user www-data ani-doctor-p8-smoke php /tmp/website-http-probes.php > "$RUNNER_TEMP/security-results/http-probes.json"
          http_status=$?
          set -e
          cat "$RUNNER_TEMP/security-results/http-probes.json"
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker inspect ghcr.io/zaproxy/zaproxy:stable --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/security-results/engine-digest.json"
          set +e
          timeout 900 docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/tests/Security/zap-plan.yaml:/zap/wrk/plan.yaml:ro" \
            -v "$RUNNER_TEMP/security-results:/zap/wrk/results:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap.sh -cmd -autorun /zap/wrk/plan.yaml
          scan_status=$?
          set -e
          python3 tests/Security/summarize-zap.py "$RUNNER_TEMP/security-results/zap-report.json"
          test "$scan_status" -eq 0
          test "$http_status" -eq 0

      - name: Upload isolated security scan evidence
        if: always() && steps.detect.outputs.app == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ani-doctor-security-${{ github.run_number }}
          path: ${{ runner.temp }}/security-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload host-ready artifact
        if: steps.detect.outputs.app == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ani-doctor-host-ready-${{ github.run_number }}
          path: ${{ steps.bundle.outputs.file }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
