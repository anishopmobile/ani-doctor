display_errors=Off
display_startup_errors=Off
expose_php=Off
log_errors=On
zend.exception_ignore_args=On
; Only authorized editorial image routes accept files; private medical forms still reject files.
file_uploads=On
upload_max_filesize=2M
post_max_size=3M
max_file_uploads=1
memory_limit=256M
max_execution_time=30
date.timezone=UTC
opcache.enable=1
opcache.validate_timestamps=0
