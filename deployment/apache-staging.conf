ServerTokens Prod
ServerSignature Off
LogFormat "%m %U %>s %D" private_access
<VirtualHost *:18443>
    ServerName localhost
    DocumentRoot /var/www/app/public
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/p8.crt
    SSLCertificateKeyFile /etc/ssl/private/p8.key
    <Directory /var/www/app>
        Require all denied
    </Directory>
    <Directory /var/www/app/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    LimitRequestBody 2097152
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 private_access
</VirtualHost>
