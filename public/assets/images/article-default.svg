
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">تصویر پیش‌فرض آنی دکتر</title>
  <desc id="desc">
    تصویر نمادین مقاله با زمینه روشن و برگ‌های تزئینی
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFB"></stop>
      <stop offset="100%" stop-color="#DCEFF0"></stop>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"></rect>

  <g fill="#9BCACA" opacity=".45">
    <ellipse cx="115" cy="135" rx="28" ry="65" transform="rotate(-40 115 135)"></ellipse>
    <ellipse cx="160" cy="195" rx="25" ry="55" transform="rotate(35 160 195)"></ellipse>
    <ellipse cx="685" cy="290" rx="28" ry="65" transform="rotate(40 685 290)"></ellipse>
    <ellipse cx="635" cy="340" rx="25" ry="55" transform="rotate(-35 635 340)"></ellipse>
  </g>

  <g stroke="#176F78" stroke-width="10" stroke-linejoin="round" fill="none">
    <rect x="320" y="125" width="160" height="130" rx="15"></rect>
    <circle cx="365" cy="163" r="13" fill="#9BCACA" stroke="none"></circle>
    <path d="M330 230 L380 188 L413 218
             L446 180 L470 205"></path>
  </g>

  <text x="400" y="320" font-size="29" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#176F78" direction="rtl">آنی دکتر</text>

  <text x="400" y="355" font-size="18" font-family="sans-serif" text-anchor="middle" fill="#637681" direction="rtl">مقالات سلامت زنان</text>
</svg>
